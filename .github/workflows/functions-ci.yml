name: Functions CI

on:
  pull_request:
    paths:
      - "functions/**"
      - ".github/workflows/functions-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci

      - name: Run adapter tests
        run: npm test

      - name: Check runtime JavaScript syntax
        run: node --check index.js && node --check crm-lead-adapter.js && node --check crm-test-authorization.js && node --check crm-test-state.js
